<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ระบบบันทึกนักเรียนมาสาย</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,Tahoma,sans-serif} :root{--green:#08783f;--dark:#045c30;--orange:#f58220} body{background:#f4f4f4;color:#222} #loginPage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,var(--green),var(--orange))}.login-box{width:100%;max-width:400px;background:#fff;padding:35px;border-radius:25px;text-align:center;box-shadow:0 15px 40px #0004}.logo,.header-logo{object-fit:contain}.logo{width:120px;height:120px;margin-bottom:15px}.login-box h1,header h1,.section h2{color:var(--green)}.login-box h1{font-size:24px;margin-bottom:8px}.login-box p,header p{color:#777;margin-bottom:25px}input{width:100%;padding:14px;margin-bottom:12px;border:2px solid #ddd;border-radius:10px;font-size:16px}input:focus{outline:none;border-color:var(--green)}button{border:0;border-radius:10px;padding:13px 18px;cursor:pointer;font-size:16px}.login-btn{width:100%;background:var(--green);color:#fff}.login-btn:hover{background:var(--dark)}#error{color:red;margin-top:15px;font-weight:bold}#app{display:none}header{background:#fff;border-bottom:5px solid var(--orange);padding:15px 5%;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 10px #0002}.header-left{display:flex;align-items:center;gap:15px}.header-logo{width:65px;height:65px}header h1{font-size:22px}header p{font-size:14px;margin:4px 0 0}.logout-btn,.record-btn{background:var(--orange);color:#fff}.container{width:92%;max-width:1200px;margin:25px auto}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-bottom:25px}.stat,.section{background:#fff;border-radius:15px;box-shadow:0 3px 12px #00000014}.stat{padding:20px;border-left:6px solid var(--green)}.stat.orange{border-left-color:var(--orange)}.stat h3{color:#777;font-size:15px}.stat strong{font-size:32px;color:var(--green)}.section{padding:25px;margin-bottom:25px}.section h2{margin-bottom:20px}.search-grid,.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}.student-list{margin-top:15px;max-height:350px;overflow-y:auto}.student{display:flex;justify-content:space-between;align-items:center;padding:15px;border-bottom:1px solid #eee;cursor:pointer}.student:hover,.student.selected{background:#d8f0e2}.student.selected{border-left:5px solid var(--green)}.student-name,.history-name{font-weight:bold;color:var(--green);font-size:17px}.student-info{color:#777;margin-top:5px}.record-btn{font-weight:bold}.export-btn{background:var(--green);color:#fff;margin-bottom:15px}.history-item{padding:15px;border-bottom:1px solid #ddd}.delete-btn{margin-top:10px;background:#d62828;color:#fff;padding:8px 12px}.empty{color:#777;padding:15px 0}@media(max-width:700px){header h1{font-size:16px}.header-logo{width:50px;height:50px}.stats,.search-grid,.form-grid{grid-template-columns:1fr}.section{padding:18px}}
</style>
</head>
<body>
<div id="loginPage"><div class="login-box"><img src="S__2580482.jpg" class="logo" alt="โลโก้โรงเรียน"><h1>ระบบบันทึกนักเรียนมาสาย</h1><p>โรงเรียนเทศบาล ๔ (เพาะชำ)</p><input id="username" placeholder="ชื่อผู้ใช้งาน"><input id="password" type="password" placeholder="รหัสผ่าน"><button class="login-btn" onclick="login()">เข้าสู่ระบบ</button><div id="error"></div></div></div>
<div id="app"><header><div class="header-left"><img src="S__2580482.jpg" class="header-logo" alt="โลโก้โรงเรียน"><div><h1>ระบบบันทึกนักเรียนมาสาย</h1><p>โรงเรียนเทศบาล ๔ (เพาะชำ)</p></div></div><button class="logout-btn" onclick="logout()">ออกจากระบบ</button></header><main class="container">
<div class="stats"><div class="stat"><h3>นักเรียนทั้งหมด</h3><strong id="totalStudents">0</strong></div><div class="stat orange"><h3>มาสายวันนี้</h3><strong id="todayLate">0</strong></div><div class="stat"><h3>มาสายทั้งหมด</h3><strong id="totalLate">0</strong></div></div>
<section class="section"><h2>🔎 ค้นหานักเรียน</h2><div class="search-grid"><input id="searchName" placeholder="ค้นหาด้วยชื่อ-นามสกุล" oninput="renderStudents()"><input id="searchId" placeholder="ค้นหาด้วยรหัสนักเรียน" oninput="renderStudents()"></div><div class="student-list" id="studentList"></div></section>
<section class="section"><h2>📝 บันทึกการมาสาย</h2><div class="form-grid"><input class="full" id="selectedStudent" placeholder="เลือกนักเรียนจากด้านบน" readonly><input type="date" id="lateDate"><input type="time" id="lateTime"><input class="full" id="reason" placeholder="เหตุผลที่มาสาย (ถ้ามี)"><button class="record-btn full" onclick="addLate()">บันทึกการมาสาย</button></div></section>
<section class="section"><h2>📋 ประวัติการมาสาย</h2><button class="export-btn" onclick="exportCSV()">📥 ส่งออกข้อมูล CSV</button><input type="date" id="filterDate" onchange="renderHistory()"><div id="historyList"></div></section>
</main></div>
<script>
const students=[{id:'001',name:'นาย ภาคภูมิ จันทร์แจ้ง',room:'6/2'},{id:'002',name:'นาย จตุพล แก้วทอง',room:'6/2'},{id:'003',name:'นาย พงษ์ศธร สายเพชร',room:'6/2'},{id:'004',name:'นาย ภาคภูมิ บุญยิ่ง',room:'6/2'},{id:'005',name:'นาย บุลวัชร สีแก้ว',room:'6/2'},{id:'006',name:'นาย อภินันต์ สุลกุล',room:'6/7'}];let lateRecords=JSON.parse(localStorage.getItem('lateRecords')||'[]'),selectedStudent=null;
function login(){if(username.value.trim()==='project'&&password.value==='project6262'){loginPage.style.display='none';app.style.display='block';sessionStorage.loggedIn='true';updateAll()}else{error.textContent='❌ ชื่อผู้ใช้งานหรือรหัสผ่านไม่ถูกต้อง';password.value=''}}
function logout(){sessionStorage.removeItem('loggedIn');app.style.display='none';loginPage.style.display='flex'}
function renderStudents(){let n=searchName.value.toLowerCase(),i=searchId.value.toLowerCase();studentList.innerHTML='';students.filter(s=>s.name.toLowerCase().includes(n)&&s.id.includes(i)).forEach(s=>{let d=document.createElement('div');d.className='student'+(selectedStudent&&selectedStudent.id===s.id?' selected':'');d.innerHTML=`<div><div class="student-name">${s.name}</div><div class="student-info">รหัส ${s.id} | ห้อง ${s.room}</div></div>`;d.onclick=()=>{selectedStudent=s;selectedStudentInput.value=`${s.id} - ${s.name}`;renderStudents()};studentList.appendChild(d)});if(!studentList.children.length)studentList.innerHTML='<p class="empty">ไม่พบนักเรียน</p>'}
const selectedStudentInput=document.getElementById('selectedStudent');function addLate(){if(!selectedStudent)return alert('กรุณาเลือกนักเรียน');let r={id:Date.now(),studentId:selectedStudent.id,name:selectedStudent.name,room:selectedStudent.room,date:lateDate.value,time:lateTime.value,reason:reason.value};if(!r.date||!r.time)return alert('กรุณาระบุวันที่และเวลา');lateRecords.push(r);localStorage.setItem('lateRecords',JSON.stringify(lateRecords));reason.value='';updateAll();alert('บันทึกข้อมูลเรียบร้อย')}
function renderHistory(){let f=filterDate.value;historyList.innerHTML='';lateRecords.filter(r=>!f||r.date===f).slice().reverse().forEach(r=>{let d=document.createElement('div');d.className='history-item';d.innerHTML=`<div class="history-name">${r.name}</div><div>รหัส ${r.studentId} | ห้อง ${r.room}<br>วันที่ ${r.date} เวลา ${r.time}<br>เหตุผล: ${r.reason||'-'}</div><button class="delete-btn" onclick="removeRecord(${r.id})">ลบ</button>`;historyList.appendChild(d)});if(!historyList.children.length)historyList.innerHTML='<p class="empty">ยังไม่มีประวัติ</p>'}
function removeRecord(id){lateRecords=lateRecords.filter(r=>r.id!==id);localStorage.setItem('lateRecords',JSON.stringify(lateRecords));updateAll()}function updateAll(){totalStudents.textContent=students.length;totalLate.textContent=lateRecords.length;todayLate.textContent=lateRecords.filter(r=>r.date===new Date().toISOString().slice(0,10)).length;renderStudents();renderHistory()}function exportCSV(){let rows=[['รหัส','ชื่อ','ห้อง','วันที่','เวลา','เหตุผล'],...lateRecords.map(r=>[r.studentId,r.name,r.room,r.date,r.time,r.reason||''])];let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+rows.map(r=>r.map(x=>`"${String(x).replaceAll('"','""')}"`).join(',')).join('\n')],{type:'text/csv'}));a.download='late-records.csv';a.click()}document.addEventListener('DOMContentLoaded',()=>{lateDate.value=new Date().toISOString().slice(0,10);if(sessionStorage.loggedIn){loginPage.style.display='none';app.style.display='block';updateAll()}});
</script></body></html>
